name: "Azure Private Link Doctor"
description: "Diagnose an Azure Private Endpoint evidence bundle without changing Azure"
inputs:
  bundle:
    description: "Path to the evidence bundle JSON"
    required: true
  output:
    description: "Output directory"
    required: false
    default: "linkdoctor-results"
  fail-on-diagnosis:
    description: "Return a failing exit code when a root cause is found"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      env:
        LINKDOCTOR_BUNDLE: ${{ inputs.bundle }}
        LINKDOCTOR_OUTPUT: ${{ inputs.output }}
        LINKDOCTOR_FAIL: ${{ inputs.fail-on-diagnosis }}
      run: |
        args=("$LINKDOCTOR_BUNDLE" --output "$LINKDOCTOR_OUTPUT")
        if [[ "$LINKDOCTOR_FAIL" == "true" ]]; then
          args+=(--fail-on-diagnosis)
        fi
        linkdoctor "${args[@]}"
