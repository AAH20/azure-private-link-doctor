[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-private-link-doctor"
version = "0.1.0"
description = "Evidence-driven Azure Private Link, Private DNS and hybrid network diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]
keywords = ["azure", "private-link", "private-endpoint", "dns", "networking", "terraform", "bicep"]

[project.scripts]
linkdoctor = "linkdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
